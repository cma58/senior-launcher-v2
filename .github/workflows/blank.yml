# =============================================================
#  Senior Launcher v2 — Android CI + APK Release
# =============================================================

name: Build & Release APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Maak ook een GitHub Release aan'
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Bootstrap Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            echo "gradlew missing, generating wrapper..."
            gradle wrapper --gradle-version 8.10.2
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      - name: Run Android lint
        run: ./gradlew lintDebug --warning-mode=summary
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --warning-mode=summary

      - name: Rename APK with build metadata
        id: apk
        run: |
          SOURCE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          if [ -z "$SOURCE" ]; then
            echo "::error::No APK found in build output"
            exit 1
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          NAME="senior-launcher-build${{ github.run_number }}-${SHORT_SHA}-debug.apk"
          mkdir -p artifacts
          cp "$SOURCE" "artifacts/$NAME"
          echo "path=artifacts/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME"          >> "$GITHUB_OUTPUT"
          ls -lh "artifacts/$NAME"

      - name: Upload APK as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
          if-no-files-found: error

      - name: Update "latest" pre-release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest debug build"
          body: |
            **Automatische bouw van de laatste commit op `main`.**

            • Build: `#${{ github.run_number }}`
            • Commit: [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})

            ⚠️ Debug-signed APK — bij installatie waarschuwt Android voor "Onbekende bron". Dat is normaal voor debug-builds.
          files: ${{ steps.apk.outputs.path }}
          prerelease: true
          draft: false
          make_latest: false

      - name: Create versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true

      - name: Create manual release
        if: github.event_name == 'workflow_dispatch' && inputs.create_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manual-${{ github.run_number }}
          name: "Manual build #${{ github.run_number }}"
          body: "Handmatig getriggerde build van `${{ github.ref_name }}`."
          files: ${{ steps.apk.outputs.path }}
          prerelease: true
